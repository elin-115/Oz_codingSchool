# ============================================================
# 🌐 nginx 설정 파일
# ------------------------------------------------------------
# nginx = 사용자 요청을 가장 먼저 받는 "입구" (웹 서버)
#
#   브라우저 ──http://서버IP──▶ nginx(80번) ──▶ fastapi(8000번)
#
# - 사용자는 서버IP만 알면 되고, 안쪽의 fastapi 주소·포트는 몰라도 됨
# - nginx가 받은 요청을 fastapi로 대신 전달해 줌 = 리버스 프록시(Reverse Proxy)
# - docker-compose.prod.yml에서 이 파일을 nginx 컨테이너의
#   /etc/nginx/conf.d/default.conf 위치에 연결함
# ============================================================

# upstream: 요청을 넘겨줄 "뒤쪽 서버" 목록에 이름을 붙임
# 여기서는 fastapi라는 이름으로 묶음 (아래 proxy_pass에서 이 이름을 씀)
upstream fastapi {
    # 서버 주소 = compose 서비스 이름:포트
    # 같은 compose 안의 컨테이너끼리는 IP 대신 서비스 이름(fastapi)으로 찾아감
    # 서버가 여러 대면 여기에 server를 더 적어서 요청을 나눠 줄 수 있음(로드 밸런싱)
    server fastapi:8000;
}

# server: 웹사이트 하나에 대한 설정 묶음
server {
    # 80번 포트로 들어오는 요청을 받음 (http의 기본 포트)
    listen 80;

    # 요청 하나의 최대 크기. nginx 기본값은 1MB라서
    # X-Ray 사진 업로드가 막히지(413 에러) 않게 10MB로 늘림
    client_max_body_size 10M;

    # location /: 모든 주소(/, /docs, /static/..., /media/... 등) 요청에 적용
    # 화면·API·정적 파일 모두 FastAPI가 처리하므로 전부 fastapi로 넘김
    location / {
        # 위에서 만든 upstream(fastapi)으로 요청 전달. 앞에 http:// 꼭 필요
        proxy_pass http://fastapi;

        # 원래 요청 정보를 fastapi에 같이 넘겨 줌
        # (안 넘기면 fastapi 입장에선 모든 요청이 nginx에서 온 것처럼 보임)
        proxy_set_header Host $host;                                   # 사용자가 접속한 주소(도메인·IP)
        proxy_set_header X-Real-IP $remote_addr;                       # 실제 사용자 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # 거쳐 온 IP 목록
        proxy_set_header X-Forwarded-Proto $scheme;                    # http인지 https인지

        # fastapi 응답을 최대 120초까지 기다림 (기본 60초)
        # 서버가 작고 스왑을 써서 AI 예측이 느려도 504(Gateway Timeout)가 나지 않게
        proxy_read_timeout 120s;

        # 응답을 nginx에 모아 두지 않고 바로바로 사용자에게 전달
        proxy_buffering off;
    }
}
