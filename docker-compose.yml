services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    working_dir: /app
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./worker:/app/worker
      - ./static:/app/static
      - ./media:/app/media
      - venv_volume:/app/.venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 5s
      timeout: 5s
      retries: 3
      

volumes:
  venv_volume:
