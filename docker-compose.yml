services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    working_dir: /app
    # 켤 때마다 alembic으로 테이블을 최신 상태로 맞춘 뒤 서버 실행 (이미 최신이면 바로 넘어감)
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./worker:/app/worker
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 5s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-ai_health}
      MYSQL_USER: ${DB_USER:-ozcoding}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile   # 워커 Dockerfile 경로
    # Redis 연결이 끊기는 등으로 워커가 종료돼도 자동으로 다시 켜짐
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      PYTHONUNBUFFERED: "1"           # print가 바로 docker logs에 보이게 (안 하면 한참 뒤에 몰아서 나옴)
    volumes:
      - ./worker:/app/worker          # 코드 수정 바로 반영 + 모델 파일(worker/models)도 같이 들어감
      - ./media:/app/media            # ⭐ fastapi와 같은 폴더 공유 (X-Ray 읽기, 히트맵 저장)
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_volume:
  redis_volume:
